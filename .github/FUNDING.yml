    url: 'https://paypal.me/Esraderey'

# Commercial licensing
commercial:
  - type: 'Commercial License'
    url: 'mailto:msc.framework@gmail.com?subject=Commercial License Request'
  - type: 'Enterprise License'
    url: 'mailto:msc.framework@gmail.com?subject=Enterprise License Request'
  - type: 'Production License'
