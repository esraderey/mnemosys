name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  # Debe respetar requires-python (>=3.10): con 3.8, `pip install -e .[dev]`
  # falla el gate Requires-Python y tumba lint/seguridad/docs/performance.
  PYTHON_VERSION: '3.10'

permissions:
  contents: read

jobs:
  # Job de calidad de código
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        
    - name: Cache dependencies
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .[dev]
        
    - name: Lint with flake8
      run: |
        # Errores críticos
        flake8 src/ tests/ examples/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Advertencias
        flake8 src/ tests/ examples/ --count --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Type check with mypy (informational, non-blocking)
      run: |
        mypy src/ --ignore-missing-imports --no-strict-optional
      continue-on-error: true

    - name: Security check with bandit
      run: |
        bandit -r src/ -ll

    - name: Format check with black (informational, non-blocking)
      run: |
        black --check src/ tests/ examples/ || echo "::warning::Code formatting issues found"

    - name: Import sorting check with isort (informational, non-blocking)
      run: |
        isort --check-only src/ tests/ examples/ || echo "::warning::Import sorting issues found"

  # Job de testing
  test:
    name: Test Suite Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # >=3.10: alineado con requires-python (el código usa str.removeprefix
        # y, tras el saldo de pyupgrade, anotaciones PEP 585/604 en runtime).
        python-version: ['3.10', '3.11', '3.12']
        
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        
    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .[dev]
        
    - name: Run tests
      run: |
        python -m pytest tests/ -v --cov=src/mneme --cov-report=xml --cov-report=html --cov-report=term
        
    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  # Job de rendimiento
  performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .[dev]
        
    - name: Run performance tests (informational, non-blocking)
      run: |
        if [ -f "examples/example_mneme.py" ]; then
          python examples/example_mneme.py --benchmark || echo "Benchmark 1 failed"
        fi
        if [ -f "examples/example_advanced_features.py" ]; then
          python examples/example_advanced_features.py --benchmark || echo "Benchmark 2 failed"
        fi
      continue-on-error: true
        
    - name: Upload performance results
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: performance-results
        path: |
          performance_results.json
          *.json
        if-no-files-found: warn
        retention-days: 30

  # Job de seguridad
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .[dev]
        pip install safety
        
    - name: Run bandit security scan
      run: |
        bandit -r src/ -f json -o bandit-report.json

    - name: Run safety check
      run: |
        safety check --json --output safety-report.json
        
    - name: Upload security reports
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json
        if-no-files-found: warn
        retention-days: 90

  # Job de documentación
  documentation:
    name: Documentation Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .[dev]
        pip install sphinx sphinx-rtd-theme
        
    - name: Verify module import
      run: |
        python -c "import src.mneme; print('Module imported successfully')"
        
    - name: Check docstrings (informational, non-blocking)
      run: |
        python -c "
        import src.mneme
        import inspect
        
        members = inspect.getmembers(src.mneme)
        classes = [m for m in members if inspect.isclass(m[1])]
        functions = [m for m in members if inspect.isfunction(m[1])]
        
        print(f'Found {len(classes)} classes and {len(functions)} functions')
        "
      continue-on-error: true
        
    - name: Check README links
      run: |
        if [ -f "README.md" ]; then
          python -c "
          import re
          with open('README.md', 'r', encoding='utf-8') as f:
              content = f.read()
          links = re.findall(r'\[([^\]]+)\]\(([^)]+)\)', content)
          print(f'Found {len(links)} links in README')
          for title, url in links:
              if url.startswith('http'):
                  print(f'  - {title}: {url}')
          "
        fi

  # Job de build y distribución
  build:
    name: Build Package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [code-quality, test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine wheel setuptools
        
    - name: Build package
      run: |
        python -m build
        
    - name: Check package
      run: |
        twine check dist/*
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: dist-${{ matrix.os }}
        path: dist/
        retention-days: 7
        if-no-files-found: error

  # Job de release
  release:
    name: Release to PyPI
    runs-on: ubuntu-latest
    needs: [build, documentation, security]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
    environment:
      name: pypi
      url: https://pypi.org/project/mneme/
    permissions:
      id-token: write  # Para PyPI trusted publishing
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        
    - name: Download build artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: dist-ubuntu-latest
        path: dist/
        
    - name: Install twine
      run: pip install twine
      
    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        twine upload dist/* --non-interactive --skip-existing
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/*
        generate_release_notes: true

  # Job de notificaciones
  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [code-quality, test, security, documentation, build]
    if: always()
    
    steps:
    - name: Check results
      run: |
        echo "Code Quality: ${{ needs.code-quality.result }}"
        echo "Tests: ${{ needs.test.result }}"
        echo "Security: ${{ needs.security.result }}"
        echo "Documentation: ${{ needs.documentation.result }}"
        echo "Build: ${{ needs.build.result }}"
        
    - name: Notify on success
      if: ${{ needs.code-quality.result == 'success' && needs.test.result == 'success' && needs.security.result == 'success' && needs.documentation.result == 'success' && needs.build.result == 'success' }}
      run: |
        echo "✅ All checks passed successfully!"
        echo "Pipeline completed at $(date)"
        
    - name: Notify on failure
      if: ${{ needs.code-quality.result == 'failure' || needs.test.result == 'failure' || needs.security.result == 'failure' || needs.documentation.result == 'failure' || needs.build.result == 'failure' }}
      run: |
        echo "❌ Some checks failed. Please review the logs."
        echo "Failed jobs:"
        [ "${{ needs.code-quality.result }}" == "failure" ] && echo "  - Code Quality"
        [ "${{ needs.test.result }}" == "failure" ] && echo "  - Tests"
        [ "${{ needs.security.result }}" == "failure" ] && echo "  - Security"
        [ "${{ needs.documentation.result }}" == "failure" ] && echo "  - Documentation"
        [ "${{ needs.build.result }}" == "failure" ] && echo "  - Build"
        exit 1
