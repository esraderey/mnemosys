name: 🔒 MNEME v2.0 Security Scan (Safetensors + Locks Granulares)

on:
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday at 2 AM UTC
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/security-scan.yml'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.10'

jobs:
  security-scan:
    name: 🔒 Security Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # required by github/codeql-action/upload-sarif
      actions: read           # required by upload-sarif on private repos

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: 0  # Full history for better analysis
    
    - name: 🐍 Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: 📦 Cache dependencies
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cache/pip
          ~/.cache/pypoetry
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: 📥 Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt || echo "⚠️ requirements.txt not found"
        pip install -e .[dev] || pip install -e . || echo "⚠️ Package installation failed"
        pip install bandit safety semgrep
    
    - name: 🔒 Bandit Security Scan
      run: |
        echo "Running Bandit security scan..."
        if [ -d "src/" ]; then
          bandit -r src/ -f json -o bandit-report.json || true
          bandit -r src/ -f txt
        else
          echo "⚠️ src/ directory not found"
          echo '{"results": [], "errors": ["src directory not found"]}' > bandit-report.json
        fi

    - name: 🛡️ Safety Dependency Check
      run: |
        echo "Checking for known security vulnerabilities..."
        safety check --json --output safety-report.json || true
        safety check

    - name: 🔍 Semgrep Security Scan
      uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
      with:
        config: >-
          p/security-audit
          p/secrets
          p/owasp-top-ten
          p/python
        generateSarif: "1"
      env:
        SEMGREP_TIMEOUT: 300
    
    - name: 📊 Upload Bandit SARIF
      if: always()
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
      with:
        sarif_file: semgrep.sarif
        category: semgrep
    
    - name: 📊 Upload security reports
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: security-reports-${{ github.run_number }}
        path: |
          bandit-report.json
          safety-report.json
          semgrep.sarif
        retention-days: 30
        if-no-files-found: warn

  dependency-audit:
    name: 📦 Dependency Audit
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    
    - name: 🐍 Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: 📥 Install audit tools
      run: |
        python -m pip install --upgrade pip
        pip install pip-audit safety pip-licenses
    
    - name: 🔍 Pip Audit (OSV Database)
      run: |
        echo "Running pip-audit against OSV database..."
        pip-audit --desc --format json --output pip-audit-report.json || true
        pip-audit --desc

    - name: 🛡️ Safety Check (Safety DB)
      run: |
        echo "Running Safety vulnerability check..."
        if [ -f "requirements.txt" ]; then
          safety check -r requirements.txt --json --output safety-detailed.json || true
          safety check -r requirements.txt
        else
          echo "⚠️ requirements.txt not found"
        fi

    - name: 📋 Generate dependency tree (informational, non-blocking)
      continue-on-error: true
      run: |
        pip install pipdeptree
        pipdeptree --json > dependency-tree.json || true
        pipdeptree || true
    
    - name: 📊 Upload dependency reports
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: dependency-audit-${{ github.run_number }}
        path: |
          pip-audit-report.json
          safety-detailed.json
          dependency-tree.json
        retention-days: 30
        if-no-files-found: warn

  code-quality:
    # Informational job: complexity/maintainability/lint/type reports with no agreed
    # pass/fail threshold. Marked non-blocking at the job level (see continue-on-error
    # below) rather than hiding that fact inside per-step `|| echo`.
    name: 📊 Code Quality Analysis (informational, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: 0
    
    - name: 🐍 Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: 📥 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt || echo "⚠️ requirements.txt not found"
        pip install -e .[dev] || pip install -e . || echo "⚠️ Package installation partial"
        pip install radon pylint flake8 mypy
    
    - name: 🎨 SonarCloud Scan
      if: env.SONAR_TOKEN != ''
      continue-on-error: true
      uses: SonarSource/sonarcloud-github-action@ba3875ecf642b2129de2b589510c81a8b53dbf4e # master (floating branch, pinned 2026-08-14; re-verify periodically)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    
    - name: 🔍 Code complexity analysis (Radon)
      continue-on-error: true
      run: |
        if [ -d "src/" ]; then
          echo "Analyzing code complexity..."
          radon cc src/ --json --output-file complexity-report.json || true
          radon cc src/ -s || echo "⚠️ Complexity analysis completed with warnings"
          
          echo "Analyzing maintainability index..."
          radon mi src/ --json --output-file maintainability-report.json || true
          radon mi src/ -s || echo "⚠️ Maintainability analysis completed"
        else
          echo "⚠️ src/ directory not found"
        fi
    
    - name: 🎨 Pylint analysis
      continue-on-error: true
      run: |
        if [ -d "src/" ]; then
          pylint src/ --output-format=json > pylint-report.json || true
          pylint src/ || echo "⚠️ Pylint found issues"
        fi
    
    - name: 🔍 Type checking (MyPy)
      continue-on-error: true
      run: |
        if [ -d "src/" ]; then
          mypy src/ --junit-xml mypy-report.xml || true
          mypy src/ || echo "⚠️ Type issues found"
        fi
    
    - name: 📊 Upload quality reports
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: quality-reports-${{ github.run_number }}
        path: |
          complexity-report.json
          maintainability-report.json
          pylint-report.json
          mypy-report.xml
        retention-days: 30
        if-no-files-found: warn

  security-testing:
    name: 🧪 Security Testing
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    
    - name: 🐍 Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: 📥 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt || echo "⚠️ requirements.txt not found"
        pip install -e .[dev] || pip install -e . || echo "⚠️ Package installation partial"
        pip install pytest pytest-cov pytest-timeout
    
    - name: 🧪 Run security unit tests
      timeout-minutes: 10
      run: |
        if [ -f "tests/test_security.py" ]; then
          python -m pytest tests/test_security.py -v --timeout=60 --tb=short
        else
          echo "⚠️ tests/test_security.py not found"
        fi

    - name: 🔒 Run penetration tests
      timeout-minutes: 10
      run: |
        if [ -f "tests/test_security_penetration.py" ]; then
          python -m pytest tests/test_security_penetration.py -v --timeout=60 --tb=short
        else
          echo "⚠️ tests/test_security_penetration.py not found"
        fi

    - name: 🛡️ Run resistance tests
      timeout-minutes: 10
      run: |
        if [ -f "tests/test_security_resistance.py" ]; then
          python -m pytest tests/test_security_resistance.py -v --timeout=60 --tb=short
        else
          echo "⚠️ tests/test_security_resistance.py not found"
        fi
    
    - name: 🔐 Create security test script
      run: |
        cat > test_security_features.py << 'SCRIPT'
        #!/usr/bin/env python3
        """Security features integration test"""
        import sys

        def test_encryption():
            try:
                from mneme import ZSpace
                import torch
                
                print("Testing encryption/decryption...")
                mneme = ZSpace()
                tensor = torch.randn(100, 100)
                
                # Test encryption
                encrypted, metadata = mneme.encrypt_tensor(tensor)
                decrypted = mneme.decrypt_tensor(encrypted, metadata)
                
                assert torch.allclose(tensor, decrypted, rtol=1e-5)
                print("✅ Encryption/Decryption test PASSED")
                return True
            except Exception as e:
                print(f"❌ Encryption test FAILED: {e}")
                return False

        def test_safetensors():
            try:
                from mneme import ZSpace
                import torch
                
                print("\nTesting safetensors serialization...")
                mneme = ZSpace()
                tensor = torch.randn(100, 100)
                
                # Test serialization
                desc = mneme.register('test_tensor', tensor)
                loaded = mneme.load('test_tensor')
                
                assert torch.allclose(tensor, loaded, rtol=1e-5)
                print("✅ Safetensors serialization test PASSED")
                return True
            except Exception as e:
                print(f"❌ Safetensors test FAILED: {e}")
                return False

        def test_key_rotation():
            try:
                from mneme import ZSpace
                
                print("\nTesting key rotation...")
                mneme = ZSpace()
                mneme.rotate_encryption_keys()
                print("✅ Key rotation test PASSED")
                return True
            except Exception as e:
                print(f"❌ Key rotation test FAILED: {e}")
                return False

        def test_authentication():
            try:
                from mneme import ZSpace
                
                print("\nTesting authentication...")
                mneme = ZSpace()
                credentials = {'username': 'test', 'password': 'test'}
                session_id = mneme.authenticate_user(credentials)
                
                assert session_id is not None
                print("✅ Authentication test PASSED")
                return True
            except Exception as e:
                print(f"❌ Authentication test FAILED: {e}")
                return False

        if __name__ == '__main__':
            results = [
                test_encryption(),
                test_safetensors(),
                test_key_rotation(),
                test_authentication()
            ]
            
            passed = sum(results)
            total = len(results)
            print(f"\n{'='*50}")
            print(f"Security Tests: {passed}/{total} passed")
            print(f"{'='*50}")
            
            sys.exit(0 if passed == total else 1)
        SCRIPT
    
    - name: 🔒 Run integrated security tests
      timeout-minutes: 5
      run: |
        python test_security_features.py
    
    - name: 📊 Generate security test report
      if: always()
      run: |
        echo "Security Test Summary" > security-test-report.txt
        echo "====================" >> security-test-report.txt
        echo "Date: $(date)" >> security-test-report.txt
        echo "Python Version: ${{ env.PYTHON_VERSION }}" >> security-test-report.txt
        echo "" >> security-test-report.txt
        cat test_security_features.py || true
    
    - name: 📊 Upload test results
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: security-test-results-${{ github.run_number }}
        path: |
          security-test-report.txt
          test_security_features.py
        retention-days: 30

  compliance:
    name: 📋 Compliance Check
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    
    - name: 🐍 Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: 📥 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt || echo "⚠️ requirements.txt not found"
        pip install -e . || echo "⚠️ Package installation partial"
        pip install pip-licenses licensecheck
    
    - name: 📋 License compliance check (informational, non-blocking)
      continue-on-error: true
      run: |
        echo "Generating license report..."
        pip-licenses --format=json --output-file=licenses.json || true
        pip-licenses --format=markdown --output-file=licenses.md || true
        pip-licenses || echo "⚠️ License check completed"

    - name: 🔍 License compatibility check
      run: |
        echo "Checking license compatibility..."
        pip-licenses --fail-on="GPL;AGPL" --format=json > incompatible-licenses.json
        echo "Checking for restrictive licenses..."
        pip-licenses --summary | grep -E "(GPL|AGPL|LGPL)" || echo "No restrictive licenses found"

    - name: 🔒 Security compliance validation
      run: |
        cat > test_compliance.py << 'SCRIPT'
        #!/usr/bin/env python3
        """Security compliance validation"""
        import sys

        def test_security_levels():
            try:
                from mneme import ZSpace, SecurityLevel
                
                print("Testing security compliance levels...")
                levels = [
                    SecurityLevel.BASIC,
                    SecurityLevel.STANDARD,
                    SecurityLevel.HIGH,
                    SecurityLevel.MAXIMUM
                ]
                
                for level in levels:
                    try:
                        mneme = ZSpace()
                        print(f"✅ Security level {level.name} validated")
                    except Exception as e:
                        print(f"❌ Security level {level.name} failed: {e}")
                        return False
                
                print("✅ All security levels validated")
                return True
            except ImportError as e:
                print(f"⚠️ Security levels not available: {e}")
                return True  # Not a failure if not implemented yet
            except Exception as e:
                print(f"❌ Security compliance test failed: {e}")
                return False

        if __name__ == '__main__':
            result = test_security_levels()
            sys.exit(0 if result else 1)
        SCRIPT

        python test_compliance.py
    
    - name: 📊 Upload compliance reports
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: compliance-reports-${{ github.run_number }}
        path: |
          licenses.json
          licenses.md
          incompatible-licenses.json
          test_compliance.py
        retention-days: 30
        if-no-files-found: warn

  summary:
    name: 📊 Security Summary
    runs-on: ubuntu-latest
    needs: [security-scan, dependency-audit, code-quality, security-testing, compliance]
    if: always()
    
    steps:
    - name: 📊 Generate security summary
      run: |
        echo "# 🔒 MNEME v2.0 Security Scan Summary" > security-summary.md
        echo "" >> security-summary.md
        echo "**Date:** $(date)" >> security-summary.md
        echo "**Workflow:** ${{ github.workflow }}" >> security-summary.md
        echo "**Run:** #${{ github.run_number }}" >> security-summary.md
        echo "" >> security-summary.md
        echo "## Job Status" >> security-summary.md
        echo "- Security Scan: ${{ needs.security-scan.result }}" >> security-summary.md
        echo "- Dependency Audit: ${{ needs.dependency-audit.result }}" >> security-summary.md
        echo "- Code Quality: ${{ needs.code-quality.result }}" >> security-summary.md
        echo "- Security Testing: ${{ needs.security-testing.result }}" >> security-summary.md
        echo "- Compliance: ${{ needs.compliance.result }}" >> security-summary.md
        echo "" >> security-summary.md
        echo "## Recommendations" >> security-summary.md
        echo "1. Review all uploaded security reports" >> security-summary.md
        echo "2. Address critical vulnerabilities immediately" >> security-summary.md
        echo "3. Update dependencies with known CVEs" >> security-summary.md
        echo "4. Verify security test coverage" >> security-summary.md
        
        cat security-summary.md
    
    - name: 📊 Upload summary
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: security-summary-${{ github.run_number }}
        path: security-summary.md
        retention-days: 90
