name: 🔒 MNEME v2.0 Security Scan (Safetensors + Locks Granulares)

on:
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday at 2 AM
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    
    - name: 🐍 Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    
    - name: 📥 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .[dev]
    
    - name: 🔒 Bandit Security Scan
      run: |
        bandit -r src/ -f json -o bandit-report.json
        bandit -r src/ -f txt
    
    - name: 🛡️ Safety Dependency Check
      run: |
        safety check --json --output safety-report.json
        safety check
    
    - name: 🔍 Semgrep Security Scan
      uses: returntocorp/semgrep-action@v1
      with:
        config: >-
          p/security-audit
          p/secrets
          p/owasp-top-ten
        generateSarif: "1"
    
    - name: 📊 Upload security reports
      uses: actions/upload-artifact@v3
      with:
        name: security-reports-${{ github.run_number }}
        path: |
          bandit-report.json
          safety-report.json
          semgrep.sarif

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    
    - name: 🐍 Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    
    - name: 📥 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .[dev]
    
    - name: 🔍 Dependency vulnerability scan
      run: |
        pip install safety
        safety check --json --output dependency-vulnerabilities.json
        safety check
    
    - name: 📊 Upload dependency scan results
      uses: actions/upload-artifact@v3
      with:
        name: dependency-scan-${{ github.run_number }}
        path: dependency-vulnerabilities.json

  code-quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    
    - name: 🐍 Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    
    - name: 📥 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .[dev]
    
    - name: 🎨 Code quality with SonarCloud
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    
    - name: 🔍 Code complexity analysis
      run: |
        pip install radon
        radon cc src/ --json --output complexity-report.json
        radon mi src/ --json --output maintainability-report.json
    
    - name: 📊 Upload quality reports
      uses: actions/upload-artifact@v3
      with:
        name: quality-reports-${{ github.run_number }}
        path: |
          complexity-report.json
          maintainability-report.json

  security-testing:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    
    - name: 🐍 Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    
    - name: 📥 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .[dev]
    
    - name: 🧪 Security tests
      run: |
        python -m pytest tests/test_security.py -v
        python -m pytest tests/test_security_penetration.py -v
        python -m pytest tests/test_security_resistance.py -v
    
    - name: 🔒 Encryption tests
      run: |
        python -c "
        from mneme import ZSpace, SecurityLevel
        mneme = ZSpace()
        # Test encryption/decryption
        tensor = __import__('torch').randn(100, 100)
        encrypted, metadata = mneme.encrypt_tensor(tensor)
        decrypted = mneme.decrypt_tensor(encrypted, metadata)
        assert __import__('torch').allclose(tensor, decrypted)
        print('✅ Encryption/Decryption test passed')
        "
    
    - name: 🛡️ Safetensors security tests
      run: |
        python -c "
        from mneme import ZSpace
        import torch
        mneme = ZSpace()
        # Test safetensors serialization
        tensor = torch.randn(100, 100)
        desc = mneme.register('test_tensor', tensor)
        loaded = mneme.load('test_tensor')
        assert torch.allclose(tensor, loaded)
        print('✅ Safetensors serialization test passed')
        "
    
    - name: 🔑 Key management tests
      run: |
        python -c "
        from mneme import ZSpace, SecurityLevel
        mneme = ZSpace()
        # Test key rotation
        mneme.rotate_encryption_keys()
        print('✅ Key rotation test passed')
        "
    
    - name: 🛡️ Authentication tests
      run: |
        python -c "
        from mneme import ZSpace
        mneme = ZSpace()
        # Test authentication
        credentials = {'username': 'test', 'password': 'test'}
        session_id = mneme.authenticate_user(credentials)
        assert session_id is not None
        print('✅ Authentication test passed')
        "

  compliance:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    
    - name: 🐍 Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    
    - name: 📥 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .[dev]
    
    - name: 📋 License compliance check
      run: |
        pip install pip-licenses
        pip-licenses --format=json --output-file=licenses.json
        pip-licenses
    
    - name: 🔒 Security compliance check
      run: |
        python -c "
        from mneme import ZSpace, SecurityLevel
        # Test security levels
        for level in [SecurityLevel.BASIC, SecurityLevel.STANDARD, SecurityLevel.HIGH, SecurityLevel.MAXIMUM]:
            mneme = ZSpace()
            print(f'✅ Security level {level.name} test passed')
        "
    
    - name: 📊 Upload compliance reports
      uses: actions/upload-artifact@v3
      with:
        name: compliance-reports-${{ github.run_number }}
        path: licenses.json
