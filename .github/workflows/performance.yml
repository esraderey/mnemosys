name: ⚡ MNEME v2.0 Performance Tests

on:
  schedule:
    - cron: '0 3 * * 1'  # Weekly on Monday at 3 AM
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  performance-benchmarks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    
    - name: 🐍 Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    
    - name: 📥 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install psutil  # Required for memory tests
        pip install -e .[dev]
    
    - name: ⚡ Basic performance tests
      run: |
        python -c "
        import time
        import torch
        from mneme import ZSpace, CompressionConfig
        
        print('🚀 MNEME v2.0 Performance Tests')
        print('=' * 70)
        
        # Test basic operations
        config = CompressionConfig(
            decomp_type='TT',
            max_rank=10,
            compression_level=3
        )
        mneme = ZSpace(config=config)
        tensor = torch.randn(1000, 1000)
        
        # Test registration
        start = time.time()
        desc = mneme.register('test_tensor', tensor)
        reg_time = time.time() - start
        print(f'📝 Registration time: {reg_time*1000:.2f}ms')
        
        # Test loading
        start = time.time()
        loaded = mneme.load('test_tensor')
        load_time = time.time() - start
        print(f'📖 Loading time: {load_time*1000:.2f}ms')
        
        # Test compression ratio
        original_size = tensor.element_size() * tensor.numel()
        compressed_size = desc.compressed_size if hasattr(desc, 'compressed_size') else original_size
        ratio = original_size / compressed_size if compressed_size > 0 else 1.0
        print(f'🗜️  Compression ratio: {ratio:.3f}x')
        
        # Test error
        error = torch.norm(tensor - loaded) / torch.norm(tensor)
        print(f'📊 Reconstruction error: {error:.6f}')
        
        print('✅ Basic performance tests passed')
        "
    
    - name: 🔄 Parallel processing tests
      run: |
        python -c "
        import time
        import torch
        import concurrent.futures
        from mneme import ZSpace
        
        print('🔄 Parallel Processing Tests')
        print('=' * 50)
        
        mneme = ZSpace()
        tensors = [torch.randn(500, 500) for _ in range(8)]
        
        # Test parallel registration using ThreadPoolExecutor
        def register_tensor(args):
            idx, tensor = args
            return mneme.register(f'parallel_{idx}', tensor)
        
        start = time.time()
        with concurrent.futures.ThreadPoolExecutor(max_workers=4) as executor:
            results = list(executor.map(register_tensor, enumerate(tensors)))
        parallel_time = time.time() - start
        print(f'⚡ Parallel registration time: {parallel_time:.3f}s')
        
        # Test parallel loading
        def load_tensor(idx):
            return mneme.load(f'parallel_{idx}')
        
        start = time.time()
        with concurrent.futures.ThreadPoolExecutor(max_workers=4) as executor:
            loaded = list(executor.map(load_tensor, range(len(tensors))))
        load_time = time.time() - start
        print(f'⚡ Parallel loading time: {load_time:.3f}s')
        
        # Calculate efficiency
        sequential_estimate = parallel_time * 4  # Rough estimate
        efficiency = sequential_estimate / parallel_time if parallel_time > 0 else 0
        print(f'📊 Parallel speedup: {efficiency:.2f}x')
        
        print('✅ Parallel processing tests passed')
        "
    
    - name: 📊 Memory usage tests
      run: |
        python -c "
        import psutil
        import torch
        from mneme import ZSpace
        
        print('📊 Memory Usage Tests')
        print('=' * 50)
        
        process = psutil.Process()
        initial_memory = process.memory_info().rss / 1024 / 1024
        
        mneme = ZSpace()
        tensors = [torch.randn(1000, 1000) for _ in range(10)]
        
        # Register tensors
        for i, tensor in enumerate(tensors):
            mneme.register(f'memory_test_{i}', tensor)
        
        peak_memory = process.memory_info().rss / 1024 / 1024
        memory_used = peak_memory - initial_memory
        
        print(f'💾 Initial memory: {initial_memory:.1f}MB')
        print(f'💾 Peak memory: {peak_memory:.1f}MB')
        print(f'💾 Memory used: {memory_used:.1f}MB')
        
        # Clear cache to optimize memory
        import gc
        gc.collect()
        torch.cuda.empty_cache() if torch.cuda.is_available() else None
        
        optimized_memory = process.memory_info().rss / 1024 / 1024
        memory_saved = peak_memory - optimized_memory
        
        print(f'💾 Optimized memory: {optimized_memory:.1f}MB')
        print(f'💾 Memory saved: {memory_saved:.1f}MB')
        
        print('✅ Memory usage tests passed')
        "
    
    - name: 🎯 Accuracy tests
      run: |
        python -c "
        import torch
        from mneme import ZSpace, CompressionConfig
        
        print('🎯 Accuracy Tests')
        print('=' * 50)
        
        tensor = torch.randn(500, 500)
        
        # Test different decomposition types
        decomp_types = ['TT', 'CP', 'SVD', 'TUCKER']
        errors = []
        ratios = []
        
        for decomp_type in decomp_types:
            try:
                config = CompressionConfig(
                    decomp_type=decomp_type,
                    max_rank=10,
                    compression_level=3
                )
                mneme = ZSpace(config=config)
                
                desc = mneme.register(f'test_{decomp_type}', tensor)
                loaded = mneme.load(f'test_{decomp_type}')
                
                error = torch.norm(tensor - loaded) / torch.norm(tensor)
                errors.append(error.item())
                print(f'📊 {decomp_type} error: {error:.6f}')
                
                # Calculate compression ratio
                original_size = tensor.element_size() * tensor.numel()
                compressed_size = desc.compressed_size if hasattr(desc, 'compressed_size') else original_size
                ratio = original_size / compressed_size if compressed_size > 0 else 1.0
                ratios.append(ratio)
                print(f'🗜️  {decomp_type} ratio: {ratio:.3f}x')
                
            except Exception as e:
                print(f'⚠️  {decomp_type} failed: {str(e)}')
        
        if errors:
            avg_error = sum(errors) / len(errors)
            print(f'\\n📊 Average error: {avg_error:.6f}')
        
        if ratios:
            avg_ratio = sum(ratios) / len(ratios)
            print(f'🗜️  Average ratio: {avg_ratio:.3f}x')
        
        print('\\n✅ Accuracy tests passed')
        "

  stress-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    
    - name: 🐍 Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    
    - name: 📥 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .[dev]
    
    - name: 🔥 Stress test with large tensors
      run: |
        python -c "
        import time
        import torch
        from mneme import ZSpace
        
        print('🔥 Stress Tests - Large Tensors')
        print('=' * 50)
        
        mneme = ZSpace()
        
        # Test with very large tensor
        large_tensor = torch.randn(2000, 2000)
        print(f'📏 Large tensor shape: {large_tensor.shape}')
        print(f'📏 Size: {large_tensor.numel() * 4 / 1024 / 1024:.1f}MB')
        
        start = time.time()
        desc = mneme.register('large_tensor', large_tensor)
        reg_time = time.time() - start
        print(f'📝 Registration time: {reg_time:.3f}s')
        
        start = time.time()
        loaded = mneme.load('large_tensor')
        load_time = time.time() - start
        print(f'📖 Loading time: {load_time:.3f}s')
        
        # Calculate compression
        original_size = large_tensor.element_size() * large_tensor.numel()
        compressed_size = desc.compressed_size if hasattr(desc, 'compressed_size') else original_size
        ratio = original_size / compressed_size if compressed_size > 0 else 1.0
        print(f'🗜️  Compression ratio: {ratio:.3f}x')
        
        error = torch.norm(large_tensor - loaded) / torch.norm(large_tensor)
        print(f'📊 Reconstruction error: {error:.6f}')
        
        print('✅ Large tensor test passed')
        "
    
    - name: 🔄 Stress test with many tensors
      run: |
        python -c "
        import time
        import torch
        from mneme import ZSpace
        
        print('🔄 Many Tensors Stress Test')
        print('=' * 50)
        
        mneme = ZSpace()
        num_tensors = 100
        tensors = [torch.randn(100, 100) for _ in range(num_tensors)]
        
        # Test registration
        start = time.time()
        for i, tensor in enumerate(tensors):
            mneme.register(f'stress_{i}', tensor)
            if (i + 1) % 25 == 0:
                print(f'  Registered {i + 1}/{num_tensors} tensors...')
        reg_time = time.time() - start
        print(f'📝 Total registration time: {reg_time:.3f}s')
        print(f'📝 Average per tensor: {reg_time/num_tensors*1000:.2f}ms')
        
        # Test loading
        start = time.time()
        for i in range(num_tensors):
            mneme.load(f'stress_{i}')
            if (i + 1) % 25 == 0:
                print(f'  Loaded {i + 1}/{num_tensors} tensors...')
        load_time = time.time() - start
        print(f'📖 Total loading time: {load_time:.3f}s')
        print(f'📖 Average per tensor: {load_time/num_tensors*1000:.2f}ms')
        
        print('✅ Many tensors test passed')
        "

  benchmark-comparison:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    
    - name: 🐍 Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    
    - name: 📥 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .[dev]
    
    - name: 📊 Benchmark comparison
      run: |
        python -c "
        import time
        import torch
        from mneme import ZSpace
        
        print('📊 Benchmark Comparison - Multiple Tensor Sizes')
        print('=' * 60)
        
        # Test different tensor sizes
        sizes = [(100, 100), (500, 500), (1000, 1000), (2000, 2000)]
        
        for size in sizes:
            print(f'\\n📏 Tensor size: {size[0]}x{size[1]}')
            tensor = torch.randn(size)
            original_size = tensor.numel() * 4 / 1024  # KB
            
            mneme = ZSpace()
            
            # Test registration
            start = time.time()
            desc = mneme.register(f'bench_{size[0]}x{size[1]}', tensor)
            reg_time = time.time() - start
            
            # Test loading
            start = time.time()
            loaded = mneme.load(f'bench_{size[0]}x{size[1]}')
            load_time = time.time() - start
            
            # Test compression
            compressed_size_bytes = desc.compressed_size if hasattr(desc, 'compressed_size') else (tensor.numel() * 4)
            compressed_size = compressed_size_bytes / 1024
            ratio = original_size / compressed_size if compressed_size > 0 else 1.0
            
            # Test accuracy
            error = torch.norm(tensor - loaded) / torch.norm(tensor)
            
            print(f'  📝 Registration: {reg_time*1000:.2f}ms')
            print(f'  📖 Loading: {load_time*1000:.2f}ms')
            print(f'  🗜️  Compression: {ratio:.3f}x')
            print(f'  📊 Error: {error:.6f}')
            print(f'  💾 Original: {original_size:.1f}KB')
            print(f'  💾 Compressed: {compressed_size:.1f}KB')
            print(f'  💾 Saved: {original_size - compressed_size:.1f}KB')
        
        print('\\n✅ Benchmark comparison completed')
        "
