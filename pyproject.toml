[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mneme"
version = "2.0.0"
description = "Motor de Memoria Neural Mórfica v2.0 - Sistema avanzado con Safetensors, Locks Granulares y Cache Adaptativo"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Esraderey and Raul Cruz Acosta", email = "msc.framework@gmail.com"}
]
maintainers = [
    {name = "Esraderey and Raul Cruz Acosta", email = "msc.framework@gmail.com"}
]
keywords = [
    "memory", "neural", "compression", "pytorch", "tensor", 
    "machine-learning", "ai", "optimization", "security", 
    "deduplication", "storage", "safetensors", "locks", 
    "lazy-decompression", "adaptive-cache", "granular-locks"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "lz4>=3.1.0",
    "msgpack>=1.0.0",
    "cryptography>=3.4.0",
    "psutil>=5.8.0",
    "tqdm>=4.62.0",
    "safetensors>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=21.0",
    "flake8>=3.8",
    "mypy>=0.800",
    "pre-commit>=2.0",
]
gpu = [
    "torch>=2.0.0",
    "cupy>=10.0.0",
]
security = [
    "cryptography>=3.4.0",
    "pycryptodome>=3.15.0",
]
optimization = [
    "numba>=0.56.0",
    "numba-cuda>=0.56.0",
]
all = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=21.0",
    "flake8>=3.8",
    "mypy>=0.800",
    "pre-commit>=2.0",
    "torch>=2.0.0",
    "cupy>=10.0.0",
    "cryptography>=3.4.0",
    "pycryptodome>=3.15.0",
    "numba>=0.56.0",
    "numba-cuda>=0.56.0",
]

[project.urls]
Homepage = "https://github.com/esraderey/MNEME---Motor-de-Memoria-Neural-M-rfica"
Documentation = "https://github.com/esraderey/MNEME---Motor-de-Memoria-Neural-M-rfica/wiki"
Repository = "https://github.com/esraderey/MNEME---Motor-de-Memoria-Neural-M-rfica"
"Bug Tracker" = "https://github.com/esraderey/MNEME---Motor-de-Memoria-Neural-M-rfica/issues"

[project.scripts]
mneme = "mneme.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require GPU",
    "security: marks tests that require security features",
]
