[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mneme"
version = "2.0.1"
description = "Motor de Memoria Neural Mórfica - Sistema avanzado de memoria computacional con síntesis determinista, verificación criptográfica robusta, aceleración de hardware y optimizaciones de rendimiento"
readme = "README.md"
license = {text = "BUSL-1.1"}
authors = [
    {name = "Esraderey", email = "msc.framework@gmail.com"},
    {name = "Raul Cruz Acosta", email = "raul.cruz.acosta@example.com"}
]
maintainers = [
    {name = "Esraderey", email = "msc.framework@gmail.com"}
]
keywords = [
    "memory", "neural", "compression", "tensor", "pytorch", 
    "machine-learning", "optimization", "security", "parallel-processing"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Topic :: Security :: Cryptography",
]
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.21.0",
    "tensorly>=0.8.0",
    "lz4>=4.0.0",
    "safetensors>=0.3.0",
    "cryptography>=3.4.0",
    "psutil>=5.8.0",
    "xxhash>=3.0.0",
    "msgpack>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "isort>=5.12.0",
    "bandit>=1.7.0",
    "pre-commit>=3.0.0",
    "ruff>=0.0.284",
]
gpu = [
    "torch[cuda]>=2.0.0",
    "tensorrt>=8.0.0",
]
security = [
    "cryptography[fernet]>=3.4.0",
    "pycryptodome>=3.15.0",
    "argon2-cffi>=21.3.0",
]
optimization = [
    "numba>=0.57.0",
    "numba[cuda]>=0.57.0",
    "cupy>=11.0.0",
]
docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "myst-parser>=1.0.0",
    "sphinx-autodoc-typehints>=1.23.0",
]

[project.urls]
Homepage = "https://github.com/esraderey/MNEME---Motor-de-Memoria-Neural-M-rfica"
Documentation = "https://github.com/esraderey/MNEME---Motor-de-Memoria-Neural-M-rfica/wiki"
Repository = "https://github.com/esraderey/MNEME---Motor-de-Memoria-Neural-M-rfica.git"
Issues = "https://github.com/esraderey/MNEME---Motor-de-Memoria-Neural-M-rfica/issues"
Discussions = "https://github.com/esraderey/MNEME---Motor-de-Memoria-Neural-M-rfica/discussions"
Changelog = "https://github.com/esraderey/MNEME---Motor-de-Memoria-Neural-M-rfica/blob/main/CHANGELOG.md"

[project.scripts]
mneme = "mneme.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mneme = ["*.py", "*.yaml", "*.yml", "*.json"]

[tool.black]
line-length = 127
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 127
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["mneme"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "tensorly.*",
    "lz4.*",
    "safetensors.*",
    "cryptography.*",
    "psutil.*",
    "xxhash.*",
    "msgpack.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--cov=src/mneme",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=90",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require GPU",
    "security: marks tests that require security features",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src/mneme"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests", "examples"]
skips = ["B101", "B601"]

[tool.ruff]
target-version = "py38"
line-length = 127
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]